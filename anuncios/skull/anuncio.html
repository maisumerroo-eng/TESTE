<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const tracos = [...document.querySelectorAll('#simbolo path')];
tracos.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
const cg = document.getElementById('cguia'); const CL = 2 * Math.PI * 330; cg.style.strokeDasharray = CL; cg.style.strokeDashoffset = CL;
const pontos = document.querySelectorAll('.pontos circle');
const svg = document.querySelector('#logo svg');
const glow = { g: 0 };
const setGlow = () => svg.style.filter = `drop-shadow(0 0 ${glow.g * 28}px rgba(241,217,160,${.15 + glow.g * .4}))`;
gsap.set(['#nome', '#subtitulo'], { opacity: 0, y: 30 });
gsap.set(pontos, { scale: 0, transformOrigin: '50% 50%' });
gsap.set(['#gv'], { scaleY: 0 }); gsap.set(['#gh'], { scaleX: 0 });
gsap.set('.palavra', { y: 40 });

const tl = gsap.timeline({ paused: true });
// 0–3 s: construção
tl.to('#gv', { scaleY: 1, duration: 1.2, ease: 'power3.inOut' }, 0.2)
  .to('#gh', { scaleX: 1, duration: 1.2, ease: 'power3.inOut' }, 0.4)
  .to(cg, { strokeDashoffset: 0, duration: 1.6, ease: 'power2.inOut' }, 0.6)
  .to(pontos, { scale: 1, duration: .35, stagger: .018, ease: 'back.out(2)' }, 1.0)
// 2–6 s: traço do crânio
  .to(tracos, { strokeDashoffset: 0, duration: 2.4, stagger: .07, ease: 'power2.inOut' }, 2.0)
  .to(pontos, { opacity: 0, duration: .5 }, 5.2)
  .to(['#gv', '#gh', '#circ'], { opacity: 0, duration: .6 }, 5.4)
// 6 s: acende (drop)
  .to('#flash', { opacity: .55, duration: .08 }, 6.0).to('#flash', { opacity: 0, duration: .5 }, 6.08)
  .to(glow, { g: 1, duration: .4, onUpdate: setGlow }, 6.0)
  .to('#luz', { opacity: 1, duration: .6 }, 6.0)
  .to('#nome', { opacity: 1, y: 0, duration: .8, ease: 'power3.out' }, 6.4)
  .to('#subtitulo', { opacity: 1, y: 0, duration: .7, ease: 'power3.out' }, 6.8)
// 9.2 s: logo sai, palavras
  .to('#logo', { scale: 1.08, duration: 2.4, ease: 'none' }, 6.8)
  .to('#logo', { opacity: 0, scale: 1.25, duration: .5, ease: 'power2.in' }, 9.2);
[['#p1', 9.7], ['#p2', 10.9], ['#p3', 12.1]].forEach(([s, t]) => {
  tl.to(s, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' }, t)
    .to(s, { opacity: 0, y: -30, duration: .25, ease: 'power2.in' }, t + .95)
    .to('#flash', { opacity: .25, duration: .05 }, t).to('#flash', { opacity: 0, duration: .3 }, t + .05);
});
// 13.6–17 s: agenda
tl.to('#agenda', { opacity: 1, duration: .4 }, 13.6)
  .from('.linha-ag', { opacity: 0, x: -60, duration: .5, stagger: .2, ease: 'power3.out' }, 13.7)
  .to('#agenda', { opacity: 0, duration: .4 }, 16.6)
// 17–20 s: CTA
  .to('#cta', { opacity: 1, duration: .5 }, 17.1)
  .from('.cta h2', { y: 50, duration: .7, ease: 'power3.out' }, 17.1)
  .from('.cta .btn', { scale: .9, opacity: 0, duration: .5, ease: 'power3.out' }, 17.6)
  .to('#cta', { opacity: 0, duration: .4 }, 19.6)
// 20–22 s: assinatura
  .set(['#gv', '#gh', '#circ'], { opacity: 0 }, 20)
  .fromTo('#logo', { opacity: 0, scale: .9 }, { opacity: 1, scale: .82, duration: .8, ease: 'power3.out', immediateRender: false }, 20.0)
  .to('#rodape', { opacity: 1, duration: .6 }, 20.5)
  .to({}, { duration: 1.3 }, 20.8);
// pulso do glow no ritmo (120 bpm) a partir do drop
for (let t = 6.5; t < 22; t += .5) tl.to('#luz', { opacity: .7, duration: .08, yoyo: true, repeat: 1 }, t);
window.__tl = tl; window.__dur = tl.duration();
</script>
</body></html>

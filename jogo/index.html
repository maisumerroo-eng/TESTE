<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1714">
<title>Almoxarifado 3D</title>
<style>
/* Layout: full-bleed WebGL stage; HUD chips pinned to corners; touch controls bottom-left / bottom-right */
:root{
  --bg:#1a1714; --ink:#f4efe8; --chip:rgba(20,18,16,.78); --line:rgba(255,255,255,.18); --accent:#ffb23e; --go:#2fb36a;
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--display);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tag{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 10px;}
.tag h1{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.tag p{margin:2px 0 0;font:500 11px var(--mono);opacity:.8}
#state{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
#state::before{content:attr(data-anim)}#state::after{content:" · " attr(data-fps) " fps"}
#goal{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font:500 11px var(--mono)}
#goal b{color:var(--go)}
#load{position:fixed;inset:0;display:grid;place-items:center;font:500 13px var(--mono);background:var(--bg)}
.pad{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid var(--line);touch-action:none;display:none}
#stick{left:max(22px,calc(env(safe-area-inset-left,0px) + 22px))}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.28)}
.btn{position:fixed;display:none;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  font:800 13px var(--display);touch-action:none;-webkit-user-select:none;user-select:none}
#jump{right:max(26px,calc(env(safe-area-inset-right,0px) + 26px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:86px;height:86px;background:rgba(255,178,62,.85);color:#1a1714}
#run{right:max(124px,calc(env(safe-area-inset-right,0px) + 124px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:60px;height:60px}
#run[aria-pressed="true"]{background:var(--go);color:#0d1a12}
body.touch .pad,body.touch .btn{display:block}
body.touch .keys{display:none}
[hidden]{display:none!important}
#net{font:500 11px var(--mono);opacity:.9}
#net.on{color:var(--go)}
#join{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,9,8,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#join form{background:#221e1a;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#join h2{margin:0;font-size:18px;font-weight:800}
#join p{margin:0;font:500 11px var(--mono);opacity:.75}
#join label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.85}
#join input{font:600 16px var(--display);padding:9px 10px;border-radius:5px;border:1px solid var(--line);background:#14110f;color:var(--ink)}
#join .row{display:flex;gap:8px}
#join button{flex:1;font:800 14px var(--display);padding:11px;border-radius:5px;border:0;cursor:pointer}
#join .go{background:var(--accent);color:#1a1714}
#join .solo{background:transparent;color:var(--ink);border:1px solid var(--line)}
#join input:focus-visible,#join button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="Jogo 3D do almoxarifado"></canvas>
<div class="hud">
  <div class="tag"><h1>Almoxarifado 3D</h1><p class="keys">Clique no jogo, depois: WASD / setas · Shift corre · Espaço pula · arraste gira a câmera</p><p id="state"></p><p id="net">offline</p></div>
</div>
<div id="goal" class="tag">Meta: subir no mezanino <b id="goalst">—</b></div>
<div id="stick" class="pad" aria-hidden="true"><div id="knob"></div></div>
<button id="run" class="btn" aria-pressed="false">Correr</button>
<button id="jump" class="btn">Pular</button>
<div id="load">Carregando personagem…</div>
<div id="join" hidden><form id="joinf">
  <h2>Multiplayer</h2><p>Quem entrar na mesma sala aparece no mapa.</p>
  <label for="jname">Seu nome<input id="jname" maxlength="14" autocomplete="nickname" required></label>
  <label for="jroom">Sala<input id="jroom" maxlength="16" value="almox" autocapitalize="off"></label>
  <div class="row"><button type="button" class="solo" id="jsolo">Jogar sozinho</button><button type="submit" class="go">Entrar</button></div>
</form></div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/BufferGeometryUtils.js"></script>
<script src="lib/SkeletonUtils.js"></script>
<script src="lib/mqtt.min.js"></script>
<script>
(()=>{
const canvas=document.getElementById('c');
const isTouch=matchMedia('(pointer: coarse)').matches||'ontouchstart' in window;
if(isTouch)document.body.classList.add('touch');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch&&devicePixelRatio<1.5,powerPreference:'high-performance'});
let pr=Math.min(devicePixelRatio,1.5);renderer.setPixelRatio(pr);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9dcdf);scene.fog=new THREE.Fog(0xd9dcdf,26,60);
const cam=new THREE.PerspectiveCamera(55,1,0.1,120);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b4a3a,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(8,16,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:40});scene.add(sun);scene.add(sun.target);

// ---------- procedural textures ----------
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}t.anisotropy=4;return t}
const floorTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#8a4a42';g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?220:0},${Math.random()<.5?200:0},${Math.random()*.05})`;g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*6,2+Math.random()*6)}
  g.strokeStyle='rgba(40,20,18,.35)';g.lineWidth=3;g.strokeRect(0,0,w,h)},[12,12]);
const boxTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#c79a63';g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){g.fillStyle=`rgba(90,60,30,${Math.random()*.06})`;g.fillRect(Math.random()*w,Math.random()*h,1,10)}
  g.fillStyle='rgba(160,120,70,.9)';g.fillRect(0,h*.46,w,h*.08);
  g.fillStyle='#2b4f9e';g.font='bold 54px Archivo, sans-serif';g.fillText('⇑⇑',w*.36,h*.36);
  g.font='bold 15px IBM Plex Mono, monospace';g.fillText('CUIDADO FRÁGIL',w*.2,h*.82)});
const woodTex=canvasTex(256,64,(g,w,h)=>{g.fillStyle='#d9c08e';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.strokeStyle=`rgba(120,90,50,${Math.random()*.25})`;g.beginPath();g.moveTo(0,Math.random()*h);g.lineTo(w,Math.random()*h);g.stroke()}});
const wrapTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#2fa6e6';g.fillRect(0,0,w,h);for(let y=4;y<h;y+=10)for(let x=(y/10%2)*5;x<w;x+=10){g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(x,y,3,0,7);g.fill()}},[3,3]);

// ---------- map ----------
const solids=[]; // AABBs {min:Vector3,max:Vector3}
const matBox=new THREE.MeshLambertMaterial({map:boxTex});
const matWood=new THREE.MeshLambertMaterial({map:woodTex});
const matMetal=new THREE.MeshLambertMaterial({color:0x9aa3ad});
const matRail=new THREE.MeshLambertMaterial({color:0xc8323a});
const matWall=new THREE.MeshLambertMaterial({color:0xeef0f2});
const buckets=new Map();
function addBox(x,y,z,sx,sy,sz,mat,solid=true){const g=new THREE.BoxGeometry(sx,sy,sz);g.translate(x,y+sy/2,z);
  if(!buckets.has(mat))buckets.set(mat,[]);buckets.get(mat).push(g);
  if(solid)solids.push({min:new THREE.Vector3(x-sx/2,y,z-sz/2),max:new THREE.Vector3(x+sx/2,y+sy,z+sz/2)})}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(52,52),new THREE.MeshLambertMaterial({map:floorTex}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// safety lanes
const laneMat=new THREE.MeshBasicMaterial({color:0xf2c230});
[[0,-3,40,.12],[0,3,40,.12]].forEach(([x,z,l,w])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(l,w),laneMat);m.rotation.x=-Math.PI/2;m.position.set(x,.005,z);scene.add(m)});
// walls
const WH=8;[[0,-25,52,.4],[0,25,52,.4],[-25,0,.4,52],[25,0,.4,52]].forEach(([x,z,sx,sz])=>addBox(x,0,z,sx,WH,sz,matWall,true,false));
// exit sign
const exitTex=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#1f9d55';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.font='bold 44px Archivo, sans-serif';g.fillText('SAÍDA',58,80)});
const ex=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.8),new THREE.MeshBasicMaterial({map:exitTex}));ex.position.set(0,5.4,-24.75);scene.add(ex);
// pallet helper
function pallet(x,z){addBox(x,0,z,1.2,.14,1.0,matWood);}
// box stacks (jumping route)
const route=[[-4,0,1.0],[-6,1.5,1.0],[-8,3.5,1.6],[-10,6,2.2],[-12,8.5,2.8],[-9,11,3.4]];
route.forEach(([x,z,h])=>{pallet(x,z);addBox(x,.14,z,1.6,h-.14,1.6,matBox)});
// scattered boxes & pallets
[[4,-6,.6],[5.2,-6,.6],[4.6,-6,1.2],[8,4,.8],[9.4,4.2,.8],[8.7,4.1,1.6],[-14,-8,.9],[13,-12,1.1],[14.2,-12,.6]].forEach(([x,z,h],i)=>{
  if(i===2||i===5)addBox(x,h-.6+.0,z,.9,.6,.9,matBox);else{pallet(x,z);addBox(x,.14,z,1.1,h-.14,1.1,matBox)}});
// shelving along the back wall
for(let i=0;i<6;i++){const x=-18+i*4.2,z=-22.6;
  for(const [dx,dz] of [[-1.9,-.9],[1.9,-.9],[-1.9,.9],[1.9,.9]])addBox(x+dx,0,z+dz,.12,5,.12,matMetal,true);
  for(const y of [1.6,3.2,4.8]){addBox(x,y,z,4,.08,2,matMetal,false);for(let k=0;k<3;k++)addBox(x-1.2+k*1.2,y+.08,z,1,.7,1.4,matBox,false)}
  solids.push({min:new THREE.Vector3(x-2,0,z-1),max:new THREE.Vector3(x+2,4.9,z+1)})}
// mezzanine (goal) with railing
const MZ={x:-12,z:14,sx:10,sz:5,h:4};
addBox(MZ.x,MZ.h-.2,MZ.z,MZ.sx,.2,MZ.sz,matMetal);
for(const [dx,dz] of [[-4.8,-2.3],[4.8,-2.3],[-4.8,2.3],[4.8,2.3]])addBox(MZ.x+dx,0,MZ.z+dz,.2,MZ.h-.2,.2,matMetal);
addBox(MZ.x,MZ.h,MZ.z+2.45,MZ.sx,1,.06,matRail,true);addBox(MZ.x-4.97,MZ.h,MZ.z,.06,1,MZ.sz,matRail,true);
const goalPad=new THREE.Mesh(new THREE.CircleGeometry(.9,40),new THREE.MeshBasicMaterial({color:0x2fb36a,transparent:true,opacity:.75}));goalPad.rotation.x=-Math.PI/2;goalPad.position.set(MZ.x-3,MZ.h+.01,MZ.z+.5);scene.add(goalPad);
// bubble-wrap piles (soft, walkable bumps)
const wrapMat=new THREE.MeshLambertMaterial({map:wrapTex});
[[10,-2],[11.5,-1],[6,12]].forEach(([x,z])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1.3,20,12,0,Math.PI*2,0,Math.PI/2),wrapMat);m.scale.y=.45;m.position.set(x,0,z);m.receiveShadow=true;scene.add(m);
  solids.push({min:new THREE.Vector3(x-.9,0,z-.9),max:new THREE.Vector3(x+.9,.5,z+.9)})});

buckets.forEach((gs,mat)=>{const m=new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(gs),mat);m.receiveShadow=true;scene.add(m);gs.forEach(g=>g.dispose())});
// ---------- character ----------
const player={pos:new THREE.Vector3((Math.random()-.5)*5,0,5+Math.random()*2.5),vel:new THREE.Vector3(),yaw:Math.PI,onGround:true,r:.34,h:1.75};
let model,mixer,actions={},current=null,gltfRef=null;
function play(name,fade=.2,once=false){const a=actions[name];if(!a||current===a)return;
  a.reset();a.setLoop(once?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=once;
  if(name==='Pulando')a.time=.3;
  a.play();if(current)current.crossFadeTo(a,fade,false);current=a;document.getElementById('state').dataset.anim=name}
fetch('personagem.glb').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(buf=>new Promise((res,rej)=>new THREE.GLTFLoader().parse(buf,'',res,rej))).then(g=>{
  gltfRef=g;model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});scene.add(model);
  mixer=new THREE.AnimationMixer(model);g.animations.forEach(c=>actions[c.name]=mixer.clipAction(c));
  actions['Pulando']&&(actions['Pulando'].timeScale=1.15);
  play('Parado',0);document.getElementById('load').remove();openJoin();
}).catch(e=>{document.getElementById('load').textContent='Não consegui carregar o personagem.';console.error(e)});

// ---------- input ----------
const keys=new Set();let jumpReq=false,runToggle=false;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys.add(e.code);if(e.code==='Space'){jumpReq=true;e.preventDefault()}});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden)keys.clear()});
let camYaw=Math.PI,camPitch=.32,camDist=5.2,drag=null;
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;camYaw-=(e.clientX-drag.x)*.006;camPitch=Math.min(1.1,Math.max(.08,camPitch+(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{camDist=Math.min(9,Math.max(2.5,camDist+e.deltaY*.004))},{passive:true});
// joystick
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let joy={x:0,y:0,id:null};
function joyMove(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),R=r.width/2;
  if(m>R){dx*=R/m;dy*=R/m}joy.x=dx/R;joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e)});
const joyEnd=()=>{joy={x:0,y:0,id:null};knob.style.transform=''};stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpReq=true});
const runBtn=document.getElementById('run');runBtn.addEventListener('click',()=>{runToggle=!runToggle;runBtn.setAttribute('aria-pressed',runToggle)});

// ---------- physics ----------
const G=22,JUMP=7.4,WALK=2.7,RUN=5.6,STEP=.42;
function overlapXZ(p,b,r){return p.x+r>b.min.x&&p.x-r<b.max.x&&p.z+r>b.min.z&&p.z-r<b.max.z}
function inside(p,b){return overlapXZ(p,b,player.r)&&p.y<b.max.y-STEP&&p.y+player.h>b.min.y}
function blocked(p,from){for(const b of solids){if(!inside(p,b))continue;if(from&&inside(from,b))continue;return b}return null}
function groundAt(p,prevY){let g=0;for(const b of solids){if(overlapXZ(p,b,player.r*.9)&&b.max.y<=prevY+STEP+.01)g=Math.max(g,b.max.y)}return g}
const tmp=new THREE.Vector3();let reached=false;
function step(dt){
  // input direction
  let ix=0,iz=0;if(keys.has('KeyW')||keys.has('ArrowUp'))iz+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))iz-=1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))ix+=1;if(keys.has('KeyD')||keys.has('ArrowRight'))ix-=1;
  if(joy.id!==null){ix=-joy.x;iz=-joy.y}
  const mag=Math.min(1,Math.hypot(ix,iz));
  const running=keys.has('ShiftLeft')||keys.has('ShiftRight')||runToggle||(joy.id!==null&&Math.hypot(joy.x,joy.y)>.92);
  let vx=0,vz=0;
  if(mag>.08){const fx=Math.sin(camYaw),fz=Math.cos(camYaw);// camera forward on ground
    const dx=(fx*iz+fz*ix)/Math.max(1,Math.hypot(ix,iz)),dz=(fz*iz-fx*ix)/Math.max(1,Math.hypot(ix,iz));
    const sp=(running?RUN:WALK)*mag;vx=dx*sp;vz=dz*sp;
    const target=Math.atan2(dx,dz);let d=target-player.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));player.yaw+=d*Math.min(1,dt*12)}
  const p=player.pos,prevY=p.y;
  // horizontal with step-up
  tmp.copy(p);tmp.x+=vx*dt;let b=blocked(tmp,p);if(!b)p.x=tmp.x;
  tmp.copy(p);tmp.z+=vz*dt;b=blocked(tmp,p);if(!b)p.z=tmp.z;
  // vertical
  if(jumpReq&&player.onGround){player.vel.y=JUMP;player.onGround=false;play('Pulando',.08,true)}jumpReq=false;
  player.vel.y-=G*dt;p.y+=player.vel.y*dt;
  const gnd=groundAt(p,prevY);
  if(p.y<=gnd){p.y=gnd;player.vel.y=0;if(!player.onGround){player.onGround=true}}
  else if(p.y>gnd+.05&&player.onGround&&player.vel.y<=0){player.onGround=false;if(!actions['Pulando']||current!==actions['Pulando'])play('Pulando',.15,true)}
  if(player.onGround&&(current===actions['Pulando']||!current||true)){
    const want=mag<.08?'Parado':running?'Correndo':'Andando';if(current!==actions[want])play(want,.18)}
  if(actions['Andando'])actions['Andando'].timeScale=Math.max(.6,mag);
  // goal
  const onGoal=Math.hypot(p.x-goalPad.position.x,p.z-goalPad.position.z)<1&&Math.abs(p.y-MZ.h)<.1;
  if(onGoal&&!reached){reached=true;document.getElementById('goalst').textContent='concluída!'}
  if(p.y<-5)p.set(0,0,6);
}
// ---------- multiplayer (MQTT over WebSocket) ----------
const COLORS=[0xffb23e,0x2fb36a,0xe24a4a,0x3fa7ff,0xb86bff,0xff6fb1,0x24d1c4,0xf2e14c];
const myId=Math.random().toString(36).slice(2,10);let myName='',room='',net=null,netOn=false;const remotes=new Map();
const netEl=document.getElementById('net');
function setNet(t,on){netEl.textContent=t;netEl.classList.toggle('on',!!on)}
function colorOf(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function openJoin(){const j=document.getElementById('join');document.getElementById('jname').value=ls('a3d_name')||'';
  const hr=(location.hash||'').replace('#','');if(/^[a-z0-9-]{1,16}$/.test(hr))document.getElementById('jroom').value=hr;
  j.hidden=false;document.getElementById('jname').focus()}
document.getElementById('joinf').addEventListener('submit',e=>{e.preventDefault();
  myName=(document.getElementById('jname').value||'Jogador').trim().slice(0,14)||'Jogador';
  room=(document.getElementById('jroom').value||'almox').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,16)||'almox';
  ls('a3d_name',myName);document.getElementById('join').hidden=true;canvas.focus({preventScroll:true});startNet()});
document.getElementById('jsolo').addEventListener('click',()=>{document.getElementById('join').hidden=true;setNet('sozinho');canvas.focus({preventScroll:true})});
const BROKERS=[{url:'wss://public.cloud.shiftr.io',username:'public',password:'public'},{url:'wss://broker.emqx.io:8084/mqtt'},{url:'wss://broker.hivemq.com:8884/mqtt'}];
let roomCh=null,roomMode=false;
async function startNet(){setNet('conectando…');let rm=null;
  try{if(window.claude&&typeof window.claude.use==='function')rm=await window.claude.use('room')}catch(e){rm=null}
  if(rm){roomMode=true;startRoom(rm);return}
  startMqtt()}
async function startRoom(rm){let ch=rm;
  try{ch=await rm.join('sala-'+room)}catch(e){ch=rm}
  roomCh=ch;
  ch.onConnection(c=>{netOn=c;if(c){lastSent=0;lastSig='';updNet()}else setNet('reconectando…')},
    e=>{netOn=false;setNet('multiplayer indisponível para esta conta (modo sozinho)')});
  ch.onPeers(chg=>{
    for(const p of chg.left)dropRemote(p.peer);
    if(chg.joined.some(p=>!p.sameTab))lastSig='';
    for(const p of chg.peers){if(p.sameTab)continue;const q=p.presence;if(!q||!Array.isArray(q.p)||q.p.length!==3)continue;
      onRemote([p.peer,typeof q.n==='string'?q.n:'Jogador',+q.p[0],+q.p[1],+q.p[2],+q.r||0,typeof q.a==='string'?q.a:'Parado'])}
    updNet()},()=>{})}
function startMqtt(){if(typeof mqtt==='undefined'){setNet('multiplayer indisponível aqui');return}
  const base='almox3d/v1/'+room;let bi=0;
  const tryBroker=()=>{const b=BROKERS[bi];setNet('conectando…');
    const c=mqtt.connect(b.url,{clientId:'a3d_'+myId+'_'+bi,username:b.username,password:b.password,clean:true,protocolVersion:4,connectTimeout:7000,reconnectPeriod:4000,keepalive:20,
      will:{topic:base+'/leave',payload:myId,qos:0,retain:false}});
    let ok=false;const giveUp=setTimeout(()=>{if(!ok){c.end(true);bi++;if(bi<BROKERS.length)tryBroker();else setNet('sem conexão (modo sozinho)')}},8000);
    c.on('connect',()=>{ok=true;clearTimeout(giveUp);net=c;netOn=true;c.subscribe([base+'/s',base+'/leave']);lastSent=0;updNet()});
    c.on('close',()=>{if(net===c){netOn=false;setNet('reconectando…')}});
    c.on('message',(t,m)=>{try{if(t.endsWith('/leave')){dropRemote(m.toString());return}
      const d=JSON.parse(m.toString());if(!Array.isArray(d)||d[0]===myId)return;onRemote(d)}catch(e){}})};
  tryBroker();
  addEventListener('pagehide',()=>{try{net&&net.publish(base+'/leave',myId)}catch(e){}})}
function updNet(){if(netOn)setNet(`online${roomMode?' (Claude)':''} · sala ${room} · ${remotes.size+1} jogador${remotes.size?'es':''}`,true)}
function nameTag(text,color){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.fillStyle='rgba(20,18,16,.75)';g.beginPath();g.roundRect?g.roundRect(4,8,248,48,10):g.rect(4,8,248,48);g.fill();
  g.fillStyle='#'+color.toString(16).padStart(6,'0');g.fillRect(14,24,16,16);g.fillStyle='#f4efe8';g.font='700 28px Archivo, sans-serif';g.textBaseline='middle';g.fillText(text,40,33);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));sp.scale.set(1.1,.275,1);sp.position.y=2.15;sp.renderOrder=10;return sp}
function onRemote(d){const [id,name,x,y,z,yaw,anim]=d;if(typeof id!=='string'||!gltfRef)return;let r=remotes.get(id);
  if(!r){const obj=THREE.SkeletonUtils.clone(gltfRef.scene);obj.traverse(o=>{if(o.isMesh){o.castShadow=false;o.frustumCulled=false}});
    const col=colorOf(id);const ring=new THREE.Mesh(new THREE.RingGeometry(.38,.5,32),new THREE.MeshBasicMaterial({color:col}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;obj.add(ring);
    obj.add(nameTag(String(name).slice(0,14),col));obj.position.set(x,y,z);scene.add(obj);
    const mx=new THREE.AnimationMixer(obj);const acts={};gltfRef.animations.forEach(c=>acts[c.name]=mx.clipAction(c));
    r={obj,mx,acts,cur:null,target:new THREE.Vector3(x,y,z),yaw,last:0};remotes.set(id,r);updNet()}
  r.target.set(+x||0,+y||0,+z||0);r.yaw=+yaw||0;r.last=performance.now();
  const a=r.acts[anim];if(a&&r.cur!==a){a.reset();a.setLoop(anim==='Pulando'?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=anim==='Pulando';if(anim==='Pulando')a.time=.3;a.play();if(r.cur)r.cur.crossFadeTo(a,.15,false);r.cur=a}}
function dropRemote(id){const r=remotes.get(id);if(!r)return;scene.remove(r.obj);r.mx.stopAllAction();remotes.delete(id);updNet()}
let lastSent=0,lastSig='';
function netTick(dt){if(!netOn||(!net&&!roomCh))return;const now=performance.now();const p=player.pos;const an=current?current.getClip().name:'Parado';
  const sig=[p.x.toFixed(2),p.y.toFixed(2),p.z.toFixed(2),player.yaw.toFixed(2),an].join();
  if((sig!==lastSig&&now-lastSent>66)||(!roomMode&&now-lastSent>1000)){lastSent=now;lastSig=sig;
    if(roomCh)roomCh.presence({n:myName,p:[+p.x.toFixed(2),+p.y.toFixed(2),+p.z.toFixed(2)],r:+player.yaw.toFixed(2),a:an}).catch(()=>{});
    else net.publish('almox3d/v1/'+room+'/s',JSON.stringify([myId,myName,+p.x.toFixed(2),+p.y.toFixed(2),+p.z.toFixed(2),+player.yaw.toFixed(2),an]))}
  for(const [id,r] of remotes){if(!roomMode&&now-r.last>6000){dropRemote(id);continue}
    r.obj.position.lerp(r.target,1-Math.exp(-12*dt));let d=r.yaw-r.obj.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));r.obj.rotation.y+=d*Math.min(1,dt*10);r.mx.update(dt)}}
// ---------- loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();const camPos=new THREE.Vector3(0,3,12);
let perfT=0,perfN=0,perfLevel=0,fpsT=0,fpsN=0;const stateEl=document.getElementById('state');
function adapt(dt){perfT+=dt;perfN++;if(perfT<2)return;const avg=perfT/perfN;perfT=0;perfN=0;
  if(avg>1/40&&perfLevel===0){perfLevel=1;pr=1;renderer.setPixelRatio(1);resize()}
  else if(avg>1/40&&perfLevel===1){perfLevel=2;sun.castShadow=false;renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true})}}
renderer.setAnimationLoop(()=>{const raw=clock.getDelta(),dt=Math.min(raw,1/20);if(model)adapt(clock.elapsedTime>3?dt:0);
  fpsT+=raw;fpsN++;if(fpsT>1){stateEl.dataset.fps=Math.round(fpsN/fpsT);fpsT=0;fpsN=0}
  if(model){step(dt);model.position.copy(player.pos);model.rotation.y=player.yaw;mixer.update(dt);netTick(dt)}
  goalPad.material.opacity=.55+.25*Math.sin(clock.elapsedTime*3);
  const t=player.pos;const want=new THREE.Vector3(t.x-Math.sin(camYaw)*Math.cos(camPitch)*camDist,t.y+1.3+Math.sin(camPitch)*camDist,t.z-Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camPos.lerp(want,1-Math.pow(.001,dt));cam.position.copy(camPos);cam.lookAt(t.x,t.y+1.25,t.z);
  sun.position.set(t.x+8,16,t.z+6);sun.target.position.copy(t);
  renderer.render(scene,cam)});
document.getElementById('goalst').textContent='pendente';
})();
